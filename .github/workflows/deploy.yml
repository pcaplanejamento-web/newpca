name: Deploy Cloudflare

# Publica automaticamente a cada push na main (e permite disparo manual).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # cloudflare-env.d.ts é gerado (não versionado) — o type-check depende dele.
      - name: Gerar tipos do Cloudflare
        run: npm run cf-typegen

      # Portão de qualidade: type-check, lint e testes BLOQUEIAM o deploy (baseline de tipos
      # limpo — um erro de tipos novo não chega ao ar; o build segue com ignoreBuildErrors
      # porque o type-check já foi feito aqui).
      - name: Type-check
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Testes (node:test)
        run: npm test

      - name: Build + Deploy (Cloudflare Workers + D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."
            echo "Configure em: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          bash scripts/publish.sh
