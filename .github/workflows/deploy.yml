name: Deploy Cloudflare

# Publica automaticamente a cada push na main (e permite disparo manual).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # cloudflare-env.d.ts é gerado (não versionado) — só o type-check (informativo)
      # depende dele; não pode bloquear o deploy.
      - name: Gerar tipos do Cloudflare
        run: npm run cf-typegen
        continue-on-error: true

      # Portão de qualidade: lint e testes BLOQUEIAM o deploy. O type-check é
      # informativo (o build usa ignoreBuildErrors por divergências workerd×DOM);
      # torná-lo bloqueante quando o baseline de tipos estiver 100% limpo.
      - name: Type-check (informativo)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint (Biome)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build + Deploy (Cloudflare Workers + D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."
            echo "Configure em: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          bash scripts/publish.sh
