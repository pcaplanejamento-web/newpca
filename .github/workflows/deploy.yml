name: Deploy Cloudflare

# Publica automaticamente a cada push na main (e permite disparo manual).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build + Deploy (Cloudflare Workers + D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN não configurado — deploy ignorado."
            echo "Configure em: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          bash scripts/publish.sh
