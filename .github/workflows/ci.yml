name: CI

# Qualidade em Pull Requests (sem deploy). O push na main é coberto pelo
# portão de qualidade do deploy.yml, evitando execução duplicada.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # cloudflare-env.d.ts é gerado (não versionado) — o type-check depende dele.
      - name: Gerar tipos do Cloudflare
        run: npm run cf-typegen

      # Portão de qualidade: type-check, lint e testes BLOQUEIAM (baseline de tipos limpo).
      - name: Type-check
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Testes (node:test)
        run: npm test

  # E2E dos fluxos LOGADOS (Playwright) contra o app local (Miniflare/D1) com usuário
  # semeado. INFORMATIVO por enquanto (continue-on-error) até estabilizar — depois vira
  # bloqueante. Playwright é instalado efêmero (fora do lock) p/ não mexer no `npm ci`.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar tipos do Cloudflare (p/ o next dev)
        run: npm run cf-typegen
        continue-on-error: true

      - name: Instalar Playwright (efêmero, fora do lock)
        run: |
          npm i -D --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
