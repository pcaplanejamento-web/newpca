name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a correção dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "p97608" "SELECT p.numero, p.valor_capa, p.atualizado_em AS capa_em, d.numero AS dfd, d.planejamento, d.total_itens, d.valor_total, d.atualizado_em AS dfd_em FROM dfd_protocolos p LEFT JOIN dfds d ON d.protocolo_id = p.id WHERE p.numero = '97608/2026' ORDER BY d.numero"
          q "aud97608" "SELECT a.id, a.criado_em, a.acao, a.entidade, a.origem, substr(a.resumo, 1, 220) AS resumo FROM auditoria a WHERE a.protocolo_id = (SELECT id FROM dfd_protocolos WHERE numero = '97608/2026') OR (a.entidade = 'protocolo' AND a.entidade_id = (SELECT id FROM dfd_protocolos WHERE numero = '97608/2026')) ORDER BY a.id DESC LIMIT 8"
          q "itens_sem_valor" "SELECT p.numero, COUNT(DISTINCT d.id) AS dfds, COUNT(*) AS itens, substr(group_concat(DISTINCT d.numero), 1, 80) AS nums FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id LEFT JOIN dfd_protocolos p ON p.id = d.protocolo_id WHERE i.valor_unitario IS NULL OR i.valor_unitario <= 0 GROUP BY p.numero ORDER BY itens DESC"
