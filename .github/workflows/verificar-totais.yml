name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a auditoria dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "itens_dfd_272" "SELECT i.sequencial, i.item, i.codigo, i.unidade, i.quantidade, i.valor_unitario, i.valor_total, ROUND(i.quantidade * i.valor_unitario, 2) AS q_x_vu, substr(i.descricao, 1, 80) AS descricao FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id WHERE d.numero = '272' ORDER BY i.sequencial"
          q "historico_dfd_272" "SELECT a.acao, a.origem, a.criado_em, substr(a.resumo, 1, 200) AS resumo FROM auditoria a JOIN dfds d ON d.id = a.entidade_id WHERE a.entidade = 'dfd' AND d.numero = '272' ORDER BY a.id"
          q "itens_dfd_899" "SELECT i.sequencial, i.item, i.codigo, i.unidade, i.quantidade, i.valor_unitario, i.valor_total, ROUND(i.quantidade * i.valor_unitario, 2) AS q_x_vu, substr(i.descricao, 1, 80) AS descricao FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id WHERE d.numero = '899' ORDER BY i.sequencial"
          q "historico_dfd_899" "SELECT a.acao, a.origem, a.criado_em, substr(a.resumo, 1, 200) AS resumo FROM auditoria a JOIN dfds d ON d.id = a.entidade_id WHERE a.entidade = 'dfd' AND d.numero = '899' ORDER BY a.id"
          q "fracao_de_centavo" "SELECT (SELECT COUNT(*) FROM dfd_itens WHERE valor_total IS NOT NULL AND ABS(valor_total * 100 - ROUND(valor_total * 100)) > 0.000001) AS itens_com_fracao, (SELECT COUNT(DISTINCT dfd_id) FROM dfd_itens WHERE valor_total IS NOT NULL AND ABS(valor_total * 100 - ROUND(valor_total * 100)) > 0.000001) AS dfds_com_fracao, (SELECT COUNT(*) FROM (SELECT dfd_id, ROUND(SUM(valor_total), 2) AS a, ROUND(SUM(ROUND(valor_total, 2)), 2) AS b FROM dfd_itens GROUP BY dfd_id) WHERE ABS(a - b) >= 0.005) AS dfds_arredondamento_muda"
