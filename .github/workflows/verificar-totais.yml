name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a correção dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "migracoes" "SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 4"
          q "dfd_x_itens" "SELECT COUNT(*) AS dfds, SUM(CASE WHEN COALESCE(i.n,0) < COALESCE(d.total_itens,0) THEN 1 ELSE 0 END) AS parciais, SUM(CASE WHEN COALESCE(i.n,0) >= COALESCE(d.total_itens,0) AND (d.total_itens IS NOT COALESCE(i.n,0) OR ABS(COALESCE(d.valor_total,0) - CASE WHEN COALESCE(i.s,0) > 0 THEN i.s ELSE 0 END) >= 0.00005) THEN 1 ELSE 0 END) AS divergentes, SUM(CASE WHEN d.valor_total IS NOT NULL AND ABS(d.valor_total * 100 - ROUND(d.valor_total * 100)) > 0.000001 THEN 1 ELSE 0 END) AS dfds_com_fracao_de_centavo, ROUND(SUM(COALESCE(d.valor_total,0)),4) AS soma_dfds, ROUND(SUM(COALESCE(i.s,0)),4) AS soma_itens FROM dfds d LEFT JOIN (SELECT dfd_id, COUNT(*) n, ROUND(SUM(COALESCE(valor_total,0)),4) s FROM dfd_itens GROUP BY dfd_id) i ON i.dfd_id = d.id"
          q "centavo_entre_abas" "SELECT COUNT(*) AS protocolos, SUM(CASE WHEN ROUND(sd * 100) <> ROUND(si * 100) THEN 1 ELSE 0 END) AS diferentes FROM (SELECT d.protocolo_id, SUM(COALESCE(d.valor_total, 0)) AS sd, SUM(COALESCE((SELECT SUM(i.valor_total) FROM dfd_itens i WHERE i.dfd_id = d.id), 0)) AS si FROM dfds d WHERE d.protocolo_id IS NOT NULL GROUP BY d.protocolo_id)"
          q "capa_x_somatoria" "SELECT p.numero, p.valor_capa, ROUND(COALESCE(x.s,0) + COALESCE(r.s,0), 4) AS somatoria, ROUND(COALESCE(p.valor_capa,0) - COALESCE(x.s,0) - COALESCE(r.s,0), 4) AS diferenca FROM dfd_protocolos p LEFT JOIN (SELECT protocolo_id, SUM(COALESCE(valor_total,0)) s FROM dfds WHERE protocolo_id IS NOT NULL GROUP BY protocolo_id) x ON x.protocolo_id = p.id LEFT JOIN (SELECT protocolo_id, SUM(COALESCE(valor_total,0)) s FROM dfd_passagens GROUP BY protocolo_id) r ON r.protocolo_id = p.id WHERE COALESCE(p.valor_capa,0) <= 0 OR ABS(ROUND(p.valor_capa * 10000) - ROUND((COALESCE(x.s,0) + COALESCE(r.s,0)) * 10000)) >= 100"
