name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a auditoria dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "dfd_importado_x_atual" "WITH imp AS (SELECT entidade_id AS dfd_id, id, depois, ROW_NUMBER() OVER (PARTITION BY entidade_id ORDER BY id DESC) AS rn FROM auditoria WHERE entidade = 'dfd' AND acao = 'importar' AND entidade_id IS NOT NULL), u AS (SELECT dfd_id, id, json_extract(depois, '$.numero') AS num, json_extract(depois, '$.valorTotal') AS declarado, json_extract(depois, '$.totalItens') AS itens_decl FROM imp WHERE rn = 1 AND depois IS NOT NULL), c AS (SELECT d.numero, d.planejamento, (SELECT p.numero FROM dfd_protocolos p WHERE p.id = d.protocolo_id) AS protocolo, d.valor_total AS atual, u.declarado, u.itens_decl, d.total_itens, (SELECT COUNT(*) FROM auditoria a WHERE a.entidade = 'dfd' AND a.entidade_id = d.id AND a.id > u.id AND a.acao <> 'importar') AS edicoes FROM dfds d JOIN u ON u.dfd_id = d.id AND CAST(u.num AS TEXT) = d.numero) SELECT COUNT(*) AS comparaveis, SUM(CASE WHEN ABS(COALESCE(atual,0) - COALESCE(declarado,0)) < 0.005 THEN 1 ELSE 0 END) AS iguais, SUM(CASE WHEN ABS(COALESCE(atual,0) - COALESCE(declarado,0)) >= 0.005 AND edicoes > 0 THEN 1 ELSE 0 END) AS dif_editados, SUM(CASE WHEN ABS(COALESCE(atual,0) - COALESCE(declarado,0)) >= 0.005 AND edicoes = 0 THEN 1 ELSE 0 END) AS dif_sem_edicao, SUM(CASE WHEN ABS(COALESCE(atual,0) - COALESCE(declarado,0)) BETWEEN 0.005 AND 0.05 AND edicoes = 0 THEN 1 ELSE 0 END) AS dif_centavos_sem_edicao, SUM(CASE WHEN itens_decl IS NOT total_itens THEN 1 ELSE 0 END) AS itens_dif FROM c"
          q "dfd_importado_x_atual_lista" "WITH imp AS (SELECT entidade_id AS dfd_id, id, depois, ROW_NUMBER() OVER (PARTITION BY entidade_id ORDER BY id DESC) AS rn FROM auditoria WHERE entidade = 'dfd' AND acao = 'importar' AND entidade_id IS NOT NULL), u AS (SELECT dfd_id, id, json_extract(depois, '$.numero') AS num, json_extract(depois, '$.valorTotal') AS declarado, json_extract(depois, '$.totalItens') AS itens_decl FROM imp WHERE rn = 1 AND depois IS NOT NULL), c AS (SELECT d.numero, d.planejamento, (SELECT p.numero FROM dfd_protocolos p WHERE p.id = d.protocolo_id) AS protocolo, d.valor_total AS atual, u.declarado, u.itens_decl, d.total_itens, (SELECT COUNT(*) FROM auditoria a WHERE a.entidade = 'dfd' AND a.entidade_id = d.id AND a.id > u.id AND a.acao <> 'importar') AS edicoes FROM dfds d JOIN u ON u.dfd_id = d.id AND CAST(u.num AS TEXT) = d.numero) SELECT numero, planejamento, protocolo, declarado, atual, ROUND(COALESCE(atual,0) - COALESCE(declarado,0),2) AS diferenca, itens_decl, total_itens, edicoes FROM c WHERE ABS(COALESCE(atual,0) - COALESCE(declarado,0)) >= 0.005 OR itens_decl IS NOT total_itens ORDER BY ABS(COALESCE(atual,0) - COALESCE(declarado,0)) DESC LIMIT 60"
          q "protocolos_info" "SELECT numero, assunto, CASE WHEN nome_arquivo IS NOT NULL THEN 1 ELSE 0 END AS do_pdf, criado_em, ano_pca, CASE WHEN pca_incorporado_em IS NOT NULL THEN 1 ELSE 0 END AS incorporado FROM dfd_protocolos WHERE numero IN ('97608/2026', '103648/2026', '122516/2026', '125900/2026', '136836/2026')"
          q "tipos_125900" "SELECT d.tipo, COUNT(*) AS dfds, SUM(d.total_itens) AS itens, ROUND(SUM(COALESCE(d.valor_total,0)),2) AS valor FROM dfds d JOIN dfd_protocolos p ON p.id = d.protocolo_id WHERE p.numero = '125900/2026' GROUP BY d.tipo"
          q "itens_soltos" "SELECT d.numero AS dfd, i.item, i.codigo, i.unidade, i.quantidade, i.valor_unitario, i.valor_total FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id WHERE d.numero IN ('1097', '1497') AND (i.valor_unitario IS NULL OR i.valor_unitario <= 0)"
