name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a auditoria dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "capa_protocolos" "SELECT p.numero, p.id_externo, p.valor_capa, ROUND(COALESCE(x.s,0),2) AS soma_dfds, ROUND(COALESCE(r.s,0),2) AS soma_rastro, ROUND(COALESCE(p.valor_capa,0) - COALESCE(x.s,0) - COALESCE(r.s,0),2) AS diferenca, x.n AS dfds, CASE WHEN p.pca_incorporado_em IS NOT NULL THEN 1 ELSE 0 END AS incorporado FROM dfd_protocolos p LEFT JOIN (SELECT protocolo_id, COUNT(*) n, SUM(COALESCE(valor_total,0)) s FROM dfds WHERE protocolo_id IS NOT NULL GROUP BY protocolo_id) x ON x.protocolo_id = p.id LEFT JOIN (SELECT protocolo_id, COUNT(*) n, SUM(COALESCE(valor_total,0)) s FROM dfd_passagens GROUP BY protocolo_id) r ON r.protocolo_id = p.id WHERE COALESCE(p.valor_capa,0) <= 0 OR ABS(ROUND(p.valor_capa,2) - ROUND(COALESCE(x.s,0) + COALESCE(r.s,0),2)) >= 0.01"
          q "itens_sem_valor" "SELECT COUNT(*) AS itens, COUNT(DISTINCT i.dfd_id) AS dfds, COUNT(DISTINCT d.protocolo_id) AS protocolos, SUM(CASE WHEN i.valor_unitario IS NULL THEN 1 ELSE 0 END) AS vu_nulo, SUM(CASE WHEN i.valor_unitario = 0 THEN 1 ELSE 0 END) AS vu_zero, SUM(CASE WHEN i.valor_unitario < 0 THEN 1 ELSE 0 END) AS vu_negativo, SUM(CASE WHEN COALESCE(i.valor_total,0) > 0 THEN 1 ELSE 0 END) AS com_total, SUM(CASE WHEN i.quantidade IS NULL OR i.quantidade <= 0 THEN 1 ELSE 0 END) AS sem_qtd, SUM(CASE WHEN p.pca_incorporado_em IS NOT NULL THEN 1 ELSE 0 END) AS em_incorporados FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id LEFT JOIN dfd_protocolos p ON p.id = d.protocolo_id WHERE i.valor_unitario IS NULL OR i.valor_unitario <= 0"
          q "dfds_com_itens_sem_valor" "SELECT d.numero AS dfd, d.planejamento, p.numero AS protocolo, COUNT(*) AS itens_sem_valor, d.total_itens, CASE WHEN p.pca_incorporado_em IS NOT NULL THEN 1 ELSE 0 END AS incorporado FROM dfd_itens i JOIN dfds d ON d.id = i.dfd_id LEFT JOIN dfd_protocolos p ON p.id = d.protocolo_id WHERE i.valor_unitario IS NULL OR i.valor_unitario <= 0 GROUP BY d.id ORDER BY itens_sem_valor DESC LIMIT 60"
          q "regra_valor_unitario" "SELECT json_extract(dados, '$.avaliacao.pontos.\"item.valorUnitario\"') AS nivel, json_extract(dados, '$.avaliacao.exProtocolo') AS por_categoria, json_extract(dados, '$.avaliacao.exDfd') AS por_tipo, json_extract(dados, '$.avaliacao.importancias') AS importancias FROM configuracoes WHERE id = 1"
