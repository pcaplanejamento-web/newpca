name: Verificar totais (somente leitura)

# TEMPORÁRIO — consultas SELECT no D1 de produção para conferir a auditoria dos totais. Nada é gravado.
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-totais.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultas somente leitura
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          q() {
            echo "=== $1"
            npx wrangler d1 execute newpca-db --remote --json --yes --command "$2" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const r of JSON.parse(s))console.log(JSON.stringify(r.results))}catch(e){console.log(s)}})'
          }
          q "centavo_entre_abas" "SELECT COUNT(*) AS protocolos, SUM(CASE WHEN ABS(ROUND(sd, 2) - ROUND(si, 2)) >= 0.005 THEN 1 ELSE 0 END) AS diferentes, ROUND(SUM(sd), 2) AS soma_dfds, ROUND(SUM(si), 2) AS soma_itens_bruta FROM (SELECT d.protocolo_id, SUM(COALESCE(d.valor_total, 0)) AS sd, SUM(COALESCE((SELECT SUM(i.valor_total) FROM dfd_itens i WHERE i.dfd_id = d.id), 0)) AS si FROM dfds d WHERE d.protocolo_id IS NOT NULL GROUP BY d.protocolo_id)"
          q "centavo_entre_abas_lista" "SELECT p.numero, ROUND(x.sd, 2) AS soma_dfds, ROUND(x.si, 4) AS soma_itens_bruta, p.valor_capa FROM (SELECT d.protocolo_id, SUM(COALESCE(d.valor_total, 0)) AS sd, SUM(COALESCE((SELECT SUM(i.valor_total) FROM dfd_itens i WHERE i.dfd_id = d.id), 0)) AS si FROM dfds d WHERE d.protocolo_id IS NOT NULL GROUP BY d.protocolo_id) x JOIN dfd_protocolos p ON p.id = x.protocolo_id WHERE ABS(ROUND(x.sd, 2) - ROUND(x.si, 2)) >= 0.005"
