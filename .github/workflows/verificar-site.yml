name: Verificação temporária (site no ar)
on:
  push:
    branches: [claude/brave-turing-4ul80k]
    paths: [".github/workflows/verificar-site.yml"]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Páginas respondem 200
        run: |
          for p in / /login /design-system; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://governarv.com.br$p")
            echo "$p -> $c"
            [ "$c" = "200" ] || exit 1
          done
